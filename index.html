        tailwind.config = {

                extend: {

                        brand: '#0f2e4a',
                        accent: '#0066cc',

    <style>
        body {
            background-color: #f5f7fa;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .hero-gradient {
            background: linear-gradient(135deg, #0f2e4a 0%, #1a4b77 100%);
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .row-card {
            transition: all 0.2s ease;
        }

            .row-card:hover {
                box-shadow: 0 10px 25px rgba(0,0,0,0.05);
                transform: translateY(-2px);
            }

        .image-placeholder {
            background: repeating-linear-gradient(45deg, #f0f0f0, #f0f0f0 10px, #e8e8e8 10px, #e8e8e8 20px);
        }
    </style>
</head>

                            <span className="text-gray-400 text-xs font-semibold px-2 text-center">{t.imageSpace}</span>

                            {item.prices.map((p, i) => <div key={i} className="text-sm font-semibold text-gray-800">{p}</div>)}

                            </a>
                        )}
                    </div>

                                        <span className="text-gray-400 text-xs">{t.imageSpace}</span>

                                        <span className={`absolute top-2 right-2 text-white text-[10px] font-bold px-2 py-1 rounded-sm uppercase tracking-wide ${item.diff === 'Easy' ? 'bg-green-500' : item.diff === 'Medium' ? 'bg-yellow-500' : 'bg-red-500'}`}>

                                        </span>
                                    )}
                                </div>
                                <h3 className="font-bold text-lg mb-2 text-brand">{item.name}</h3>
                                <p className="text-gray-600 text-sm">{item.desc}</p>
                            </div>
                        ))}
                    </div>
                </div>
            );

            const renderContent = () => {
                if (activeTab === 'orientation') {
                    return (
                        <div className="max-w-5xl mx-auto pb-20 mt-8">
                            <h2 className="text-3xl font-black text-brand mb-4 border-b pb-4">{t.orientation.title}</h2>
                            <p className="text-gray-600 text-lg mb-8 leading-relaxed">{t.orientation.intro}</p>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">

                                    <h3 className="text-2xl font-bold text-brand mb-3">{t.orientation.boost.title}</h3>

                                    <p className="text-gray-600 mb-6">{t.orientation.win.desc}</p>

                                        <p className="text-sm text-gray-700 leading-relaxed">{t.orientation.win.register}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    );
                }

                    return (
                        <div className="max-w-5xl mx-auto pb-20 mt-8">
                            <h2 className="text-2xl font-bold text-brand mb-6">{t.activities.waterTitle}</h2>

                                {t.activities.waterItems.map((item, i) => <RowItem key={i} item={item} />)}
                            </div>
                            <GridCard title={t.activities.beachesTitle} items={t.activities.beaches} />
                            <GridCard title={t.activities.hikingTitle} items={t.activities.hiking} isHiking={true} />
                            <h2 className="text-2xl font-bold text-brand mb-6">{t.activities.otherTitle}</h2>
                            <div className="mb-12">
                                {t.activities.otherItems.map((item, i) => <RowItem key={i} item={item} />)}
                            </div>
                            <GridCard title={t.activities.monumentsTitle} items={t.activities.monuments} />
                        </div>
                    );
                }

                if (activeTab === 'trips') {
                    return (
                        <div className="max-w-5xl mx-auto pb-20 mt-8">
                            <h2 className="text-3xl font-black text-brand mb-8 border-b pb-4">{t.trips.title}</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                {t.trips.items.map((trip, i) => (
                                    <div key={i} className="bg-white rounded-2xl p-6 border border-gray-200 row-card flex flex-col shadow-sm">
                                        <div className="w-full h-48 rounded-xl bg-gray-100 flex items-center justify-center mb-6 relative overflow-hidden">
                                            {trip.img ? (
                                                <img src={trip.img} alt={trip.name} className="w-full h-full object-cover" />
                                            ) : (
                                                <span className="text-gray-400 text-sm font-semibold">{t.imageSpace} - {trip.name}</span>
                                            )}
                                        </div>
                                        <h3 className="font-bold text-2xl mb-3 text-brand">{trip.name}</h3>
                                        <p className="text-gray-600 text-base leading-relaxed mb-6 flex-grow">{trip.desc}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="max-w-3xl mx-auto mt-10 p-12 bg-white rounded-2xl border border-dashed border-gray-300 text-center">
                        <div className="text-4xl mb-4">🚧</div>
                        <h3 className="text-xl font-bold text-gray-800 mb-2">{t.nav.find(n => n.id === activeTab)?.label}</h3>
                        <p className="text-gray-500">{t.placeholder}</p>
                    </div>
                );
            };

            return (
                <div className="min-h-screen">
                    <header className="bg-white px-6 py-4 flex justify-between items-center shadow-sm sticky top-0 z-50">
                        <div className="text-2xl font-black text-brand tracking-tighter">
                            {t.brand}<span className="text-accent">.</span>
                        </div>
                        <div className="flex bg-gray-100 p-1 rounded-lg">
                            <button onClick={() => setLang('en')} className={`px-4 py-1.5 rounded-md text-sm font-bold transition ${lang === 'en' ? 'bg-white shadow text-brand' : 'text-gray-500 hover:text-gray-800'}`}>EN</button>
                            <button onClick={() => setLang('fr')} className={`px-4 py-1.5 rounded-md text-sm font-bold transition ${lang === 'fr' ? 'bg-white shadow text-brand' : 'text-gray-500 hover:text-gray-800'}`}>FR</button>
                        </div>
                    </header>

                    <div className="relative hero-gradient w-full h-[350px] flex flex-col items-center justify-center px-4 text-center overflow-hidden">

                        {/* ФОНОВЕ ЗОБРАЖЕННЯ ТУТ: Заміни "background.jpg" на назву свого файлу для головного банеру */}
                        <img
                            id="main-background"
                            src="bg.jpg"
                            className="absolute inset-0 w-full h-full object-cover opacity-50 mix-blend-overlay"
                            alt="Annecy Background"
                        />

                        <div className="relative z-10">
                            <h1 className="text-4xl md:text-6xl font-extrabold text-white mb-4 drop-shadow-lg">{t.heroTitle}</h1>
                            <p className="text-lg text-blue-50 max-w-2xl mx-auto drop-shadow-md">{t.heroSub}</p>
                        </div>
                    </div>

                    <div className="max-w-6xl mx-auto px-4 relative z-20 -mt-16 mb-12">
                        <div className="bg-white rounded-2xl shadow-lg p-6 flex gap-4 overflow-x-auto hide-scrollbar justify-start md:justify-center border border-gray-100">
                            {t.nav.map(navItem => (
                                <button
                                    key={navItem.id}
                                    onClick={() => setActiveTab(navItem.id)}
                                    className="flex flex-col items-center min-w-[100px] gap-3 group"
                                >
                                    <div className={`w-16 h-16 rounded-full flex items-center justify-center text-2xl shadow-sm transition-all duration-300 ${activeTab === navItem.id ? 'bg-accent text-white scale-110 shadow-blue-500/30' : 'bg-gray-50 text-gray-600 hover:bg-gray-100 hover:scale-105'}`}>
                                        {navItem.icon}
                                    </div>
                                    <span className={`text-sm font-semibold transition-colors ${activeTab === navItem.id ? 'text-accent' : 'text-gray-600 group-hover:text-gray-900'}`}>
                                        {navItem.label}
                                    </span>
                                </button>
                            ))}
                        </div>
                    </div>

                    <main className="px-4">
                        {renderContent()}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
