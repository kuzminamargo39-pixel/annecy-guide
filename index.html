<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annecy Guide</title>
    <meta name="description" content="The student guide to Annecy: welcome events, activities, trips, food & shopping and accommodation.">
    <meta name="theme-color" content="#0E3B43">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Content sections kept in their own files so colleagues' content is easy to update -->
    <script src="data/food.js"></script>
    <script src="data/housing.js"></script>

    <style>
        :root {
            --lake: #0E3B43;        /* the lake in shade */
            --lake-2: #145561;
            --glacier: #7FD1C7;     /* turquoise surface of Lake Annecy */
            --glacier-soft: #DDF2EE;
            --snow: #F3F7F6;        /* page */
            --paper: #FFFFFF;
            --granite: #1D2A2E;     /* text */
            --slate: #52666B;       /* secondary text */
            --stone: #D5DFDC;       /* lines */
            --mist: #E8EFED;
            --geranium: #E2475B;    /* balcony geraniums of the Old Town, used sparingly */
            --geranium-soft: #FCE7EA;
            --sun: #F2B33D;

            --display: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
            --body: "Instrument Sans", system-ui, -apple-system, sans-serif;

            --r-lg: 28px;
            --r-md: 18px;
            --r-sm: 10px;
            --wrap: 1180px;
            --ease: cubic-bezier(.2,.7,.1,1);
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            background: var(--snow);
            color: var(--granite);
            font-family: var(--body);
            font-size: 16px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }
        img { display: block; max-width: 100%; }
        a { color: inherit; }
        button { font: inherit; color: inherit; cursor: pointer; }
        :focus-visible { outline: 3px solid var(--glacier); outline-offset: 3px; border-radius: 6px; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        .wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 24px; }

        /* ---------- Header ---------- */
        .topbar {
            position: fixed; inset: 0 0 auto 0; z-index: 60;
            display: flex; align-items: center; justify-content: space-between; gap: 16px;
            padding: 16px 28px;
            color: #fff;
            transition: background .35s var(--ease), color .35s var(--ease), box-shadow .35s var(--ease), padding .35s var(--ease);
        }
        .topbar.solid {
            background: rgba(243,247,246,.82);
            backdrop-filter: saturate(1.6) blur(14px);
            -webkit-backdrop-filter: saturate(1.6) blur(14px);
            color: var(--granite);
            box-shadow: 0 1px 0 var(--stone);
            padding: 10px 28px;
        }
        .brand {
            font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: -0.02em;
            text-decoration: none; display: flex; align-items: center; gap: 10px;
        }
        .brand-mark { width: 28px; height: 28px; }
        .top-actions { display: flex; align-items: center; gap: 10px; }
        .search-btn {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 10px 8px 14px; min-width: 220px;
            border-radius: 999px; border: 1px solid rgba(255,255,255,.35);
            background: rgba(255,255,255,.12); color: inherit; font-size: 14px;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: background .2s, border-color .2s;
        }
        .topbar.solid .search-btn { border-color: var(--stone); background: var(--paper); color: var(--slate); }
        .search-btn:hover { background: rgba(255,255,255,.22); }
        .topbar.solid .search-btn:hover { border-color: var(--lake-2); }
        .search-btn span.grow { flex: 1; text-align: left; }
        .kbd { font-size: 12px; padding: 2px 7px; border-radius: 6px; border: 1px solid currentColor; opacity: .6; }
        .lang {
            display: flex; padding: 3px; border-radius: 999px;
            background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3);
        }
        .topbar.solid .lang { background: var(--mist); border-color: transparent; }
        .lang button {
            border: 0; background: transparent; padding: 6px 13px; border-radius: 999px;
            font-weight: 700; font-size: 13px; letter-spacing: .02em; color: inherit; opacity: .75;
        }
        .lang button[aria-pressed="true"] { background: #fff; color: var(--lake); opacity: 1; box-shadow: 0 2px 8px rgba(14,59,67,.18); }
        @media (max-width: 720px) {
            .topbar, .topbar.solid { padding-left: 16px; padding-right: 16px; }
            .search-btn { min-width: 0; padding: 8px 12px; }
            .search-btn .grow, .search-btn .kbd { display: none; }
        }

        /* ---------- Hero: the word and its reflection in the lake ---------- */
        .hero {
            position: relative; min-height: min(92vh, 860px); overflow: hidden;
            display: grid; align-items: end;
            background: var(--lake);
            color: #fff;
        }
        .hero-photo {
            position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
            transform: scale(1.08); animation: drift 26s var(--ease) infinite alternate;
            filter: saturate(1.05);
        }
        @keyframes drift { to { transform: scale(1.0) translateY(-1.5%); } }
        .hero::after {
            content: ""; position: absolute; inset: 0;
            background:
                linear-gradient(180deg, rgba(14,59,67,.55) 0%, rgba(14,59,67,.05) 30%, rgba(14,59,67,.15) 55%, rgba(14,59,67,.92) 100%);
        }
        .hero-inner { position: relative; z-index: 2; padding: 0 24px 0; max-width: var(--wrap); margin: 0 auto; width: 100%; }
        .hero-kicker {
            font-family: var(--display); font-weight: 500; font-size: clamp(20px, 2.4vw, 30px);
            letter-spacing: -0.01em; margin: 0 0 -0.1em 0.08em; opacity: 0;
            animation: rise .9s var(--ease) .15s forwards;
        }
        .hero-word {
            font-family: var(--display);
            font-weight: 800; font-stretch: 78%;
            font-size: clamp(88px, 21vw, 300px);
            line-height: .8; letter-spacing: -0.045em;
            margin: 0; display: flex;
        }
        .hero-word .ch { display: inline-block; opacity: 0; transform: translateY(.35em); animation: rise 1s var(--ease) forwards; }
        @keyframes rise { to { opacity: 1; transform: none; } }
        .reflection {
            font-family: var(--display); font-weight: 800; font-stretch: 78%;
            font-size: clamp(88px, 21vw, 300px); line-height: .8; letter-spacing: -0.045em;
            height: .46em; overflow: hidden;
            color: var(--glacier);
            opacity: 0; animation: fadeIn 1.6s var(--ease) .9s forwards;
            -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.6), transparent 90%);
            mask-image: linear-gradient(180deg, rgba(0,0,0,.6), transparent 90%);
            pointer-events: none; user-select: none;
        }
        .reflection span { display: block; transform: scaleY(-1); transform-origin: 50% 40%; filter: url(#ripple); }
        @keyframes fadeIn { to { opacity: .9; } }
        .waterline { height: 1px; background: linear-gradient(90deg, transparent, rgba(127,209,199,.8), transparent); }
        .hero-sub {
            display: flex; justify-content: space-between; align-items: end; gap: 32px; flex-wrap: wrap;
            padding: 4px 0 120px;
        }
        .hero-sub p {
            margin: 0; max-width: 40ch; font-size: clamp(17px, 1.5vw, 20px); line-height: 1.5; color: #E4F3F0;
            opacity: 0; animation: rise .9s var(--ease) 1.1s forwards; transform: translateY(12px);
        }
        .hero-cta {
            display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
            padding: 14px 22px; border-radius: 999px; background: #fff; color: var(--lake);
            font-weight: 700; border: 0;
            opacity: 0; animation: rise .9s var(--ease) 1.25s forwards; transform: translateY(12px);
            transition: transform .2s var(--ease), box-shadow .2s;
        }
        .hero-cta:hover { box-shadow: 0 10px 30px rgba(0,0,0,.25); }

        /* ---------- Section nav ---------- */
        .navshell { position: sticky; top: 58px; z-index: 50; margin-top: -78px; padding: 0 16px; }
        .nav {
            position: relative; max-width: var(--wrap); margin: 0 auto;
            display: flex; gap: 4px; padding: 6px;
            background: rgba(255,255,255,.9);
            backdrop-filter: saturate(1.6) blur(16px); -webkit-backdrop-filter: saturate(1.6) blur(16px);
            border: 1px solid rgba(255,255,255,.7);
            border-radius: 22px;
            box-shadow: 0 18px 50px -18px rgba(14,59,67,.45), 0 1px 0 rgba(14,59,67,.05);
            overflow-x: auto; scrollbar-width: none;
        }
        .nav::-webkit-scrollbar { display: none; }
        .nav-indicator {
            position: absolute; top: 6px; bottom: 6px; left: 0; width: 0;
            border-radius: 16px; background: var(--lake);
            transition: transform .45s var(--ease), width .45s var(--ease);
            z-index: 0;
        }
        .nav-btn {
            position: relative; z-index: 1; flex: 1 0 auto;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 11px 12px; border: 0; background: transparent; border-radius: 16px;
            font-weight: 600; font-size: 14px; color: var(--slate); white-space: nowrap;
            transition: color .3s;
        }
        .nav-btn:hover { color: var(--granite); }
        .nav-btn[aria-selected="true"] { color: #fff; }
        .nav-btn .ico { font-size: 16px; }
        .nav-btn .soon { width: 6px; height: 6px; border-radius: 50%; background: var(--stone); }
        .nav-btn[aria-selected="true"] .soon { background: rgba(255,255,255,.4); }

        /* ---------- Panels ---------- */
        main { min-height: 60vh; }
        .panel { padding-top: 72px; padding-bottom: 120px; animation: panelIn .5s var(--ease); }
        @keyframes panelIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        .panel-head { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 40px; align-items: end; margin-bottom: 48px; }
        .panel-title {
            font-family: var(--display); font-weight: 750; font-stretch: 85%;
            font-size: clamp(44px, 5.6vw, 76px); line-height: .95; letter-spacing: -0.035em;
            margin: 0; color: var(--lake);
        }
        .panel-lede { margin: 0; font-size: 18px; line-height: 1.6; color: var(--slate); max-width: 52ch; }
        @media (max-width: 860px) { .panel-head { grid-template-columns: 1fr; gap: 18px; } }

        .h2 {
            font-family: var(--display); font-weight: 700; font-size: clamp(26px, 3vw, 36px);
            letter-spacing: -0.02em; line-height: 1.1; margin: 0 0 22px; color: var(--granite);
            display: flex; align-items: center; gap: 14px;
        }
        .h2 .em { font-size: .8em; width: 1.6em; height: 1.6em; display: grid; place-items: center; border-radius: 50%; background: var(--glacier-soft); flex: none; }
        .block { margin-bottom: 80px; }

        /* ---------- Shared bits ---------- */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 11px 18px; border-radius: 999px; border: 1px solid var(--lake);
            background: var(--lake); color: #fff; text-decoration: none; font-weight: 600; font-size: 14px;
            transition: background .2s, transform .2s var(--ease);
        }
        .btn:hover { background: var(--lake-2); }
        .btn.ghost { background: transparent; color: var(--lake); border-color: var(--stone); }
        .btn.ghost:hover { border-color: var(--lake); background: var(--paper); }
        .ext { width: 14px; height: 14px; flex: none; }
        .chip {
            display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
            padding: 9px 16px; border-radius: 999px; border: 1px solid var(--stone); background: var(--paper);
            font-weight: 600; font-size: 14px; color: var(--granite);
            transition: background .2s, color .2s, border-color .2s;
        }
        .chip:hover { border-color: var(--lake-2); }
        .chip[aria-pressed="true"] { background: var(--lake); border-color: var(--lake); color: #fff; }
        .chip .count { font-size: 12px; opacity: .6; font-variant-numeric: tabular-nums; }
        .chips { display: flex; gap: 8px; flex-wrap: wrap; }
        .chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .chips.scroll::-webkit-scrollbar { display: none; }
        .flash { animation: flash 1.8s var(--ease); }
        @keyframes flash { 0%, 40% { box-shadow: 0 0 0 4px var(--glacier); } 100% { box-shadow: 0 0 0 0 transparent; } }

        /* ---------- Welcome events: a sequence, so a timeline ---------- */
        .timeline { position: relative; display: grid; gap: 28px; }
        .timeline::before { content: ""; position: absolute; left: 27px; top: 10px; bottom: 10px; width: 2px; background: linear-gradient(var(--glacier), var(--lake)); }
        .event { display: grid; grid-template-columns: 56px 1fr; gap: 24px; }
        .event-dot {
            width: 56px; height: 56px; border-radius: 50%; background: var(--lake); color: #fff; position: relative; z-index: 1;
            display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 22px;
            box-shadow: 0 0 0 6px var(--snow);
        }
        .event:nth-child(2) .event-dot { background: var(--geranium); }
        .event-card { background: var(--paper); border-radius: var(--r-lg); padding: 34px; border: 1px solid var(--stone); display: grid; grid-template-columns: 1.1fr 1fr; gap: 34px; }
        .event-when { display: inline-block; font-weight: 700; font-size: 13px; color: var(--lake-2); background: var(--glacier-soft); padding: 5px 12px; border-radius: 999px; margin-bottom: 14px; }
        .event:nth-child(2) .event-when { color: #A32336; background: var(--geranium-soft); }
        .event-card h3 { font-family: var(--display); font-size: 32px; letter-spacing: -0.02em; line-height: 1.05; margin: 0 0 12px; color: var(--lake); }
        .event-card p { color: var(--slate); margin: 0; }
        .facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
        .facts li { padding: 11px 0; border-bottom: 1px solid var(--mist); font-size: 15px; }
        .facts li:last-child { border: 0; }
        .register { margin-top: 22px; padding: 18px 20px; border-radius: var(--r-md); background: var(--snow); }
        .register h4 { margin: 0 0 6px; font-size: 15px; color: var(--lake); }
        .register p { font-size: 14.5px; }
        @media (max-width: 860px) {
            .event-card { grid-template-columns: 1fr; padding: 24px; gap: 18px; }
            .event { grid-template-columns: 40px 1fr; gap: 14px; }
            .event-dot { width: 40px; height: 40px; font-size: 17px; }
            .timeline::before { left: 19px; }
        }

        /* ---------- Activities ---------- */
        .rental { display: grid; grid-template-columns: 220px 1fr 300px; gap: 28px; align-items: center; padding: 18px; background: var(--paper); border-radius: var(--r-lg); border: 1px solid var(--stone); margin-bottom: 14px; }
        .rental-img { position: relative; height: 150px; border-radius: var(--r-md); overflow: hidden; background: var(--mist); }
        .rental-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s var(--ease); }
        .rental:hover .rental-img img { transform: scale(1.05); }
        .badge { position: absolute; top: 10px; left: 10px; background: var(--geranium); color: #fff; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
        .rental h3 { font-family: var(--display); font-size: 26px; letter-spacing: -0.02em; margin: 0 0 4px; line-height: 1.1; }
        .rental .cat { color: var(--lake-2); font-weight: 600; font-size: 14px; margin: 0 0 10px; }
        .rental .loc { display: flex; gap: 8px; color: var(--slate); font-size: 14px; margin: 0; }
        .rental .note { margin: 10px 0 0; font-size: 14px; color: var(--slate); padding-left: 12px; border-left: 2px solid var(--glacier); }
        .rental-prices { border-left: 1px solid var(--mist); padding-left: 24px; display: grid; gap: 14px; }
        .rental-prices ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
        .rental-prices li { font-weight: 600; font-size: 14.5px; font-variant-numeric: tabular-nums; }
        @media (max-width: 960px) {
            .rental { grid-template-columns: 1fr; gap: 16px; }
            .rental-img { height: 200px; }
            .rental-prices { border-left: 0; padding-left: 0; border-top: 1px solid var(--mist); padding-top: 16px; }
        }
        .tip { display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: var(--r-md); background: var(--glacier-soft); color: var(--lake); font-weight: 600; margin-bottom: 22px; }
        .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
        .gallery.feature { grid-template-columns: 1.4fr 1fr 1fr; }
        .photo-card { position: relative; border-radius: var(--r-lg); overflow: hidden; min-height: 340px; background: var(--lake); color: #fff; display: flex; align-items: flex-end; isolation: isolate; }
        .photo-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; transition: transform 1s var(--ease); }
        .photo-card::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, transparent 35%, rgba(14,59,67,.92)); }
        .photo-card:hover img { transform: scale(1.06); }
        .photo-card .body { padding: 22px; }
        .photo-card h3 { font-family: var(--display); font-size: 24px; line-height: 1.1; letter-spacing: -0.015em; margin: 0 0 6px; }
        .photo-card p { margin: 0; font-size: 14.5px; color: #DCEDEA; }
        .diff { position: absolute; top: 14px; right: 14px; font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 999px; background: #fff; color: var(--granite); display: flex; align-items: center; gap: 6px; }
        .diff i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        @media (max-width: 860px) { .gallery, .gallery.feature { grid-template-columns: 1fr; } .photo-card { min-height: 260px; } }

        /* ---------- Trips ---------- */
        .trips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
        .trip { position: relative; border-radius: var(--r-lg); background: var(--paper); border: 1px solid var(--stone); padding: 30px; min-height: 230px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
        .trip .ghost-name { position: absolute; right: -10px; bottom: -28px; font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 120px; line-height: 1; color: var(--mist); letter-spacing: -0.05em; pointer-events: none; white-space: nowrap; }
        .trip h3 { position: relative; font-family: var(--display); font-size: 30px; letter-spacing: -0.02em; margin: 0 0 10px; color: var(--lake); }
        .trip p { position: relative; margin: 0; color: var(--slate); max-width: 44ch; }
        @media (max-width: 760px) { .trips { grid-template-columns: 1fr; } }

        /* ---------- Food & Shopping ---------- */
        .legend { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-bottom: 12px; }
        .legend div { display: flex; align-items: baseline; gap: 8px; font-size: 14px; color: var(--slate); white-space: nowrap; }
        .legend b { font-family: var(--display); font-size: 18px; color: var(--lake); font-weight: 700; }
        .legend-note { font-size: 13.5px; color: var(--slate); margin: 0; max-width: 64ch; }
        .toolbar { display: flex; justify-content: space-between; gap: 18px; align-items: center; flex-wrap: wrap; padding: 14px 0 26px; border-bottom: 1px solid var(--stone); margin-bottom: 40px; }
        .toolbar .label { font-size: 13px; color: var(--slate); font-weight: 600; margin-right: 4px; }
        .price-filter { display: flex; align-items: center; gap: 6px; }
        .price-filter .chip { font-family: var(--display); padding: 7px 13px; }

        .tier { display: grid; grid-template-columns: 260px 1fr; gap: 40px; padding: 40px 0; border-top: 1px solid var(--stone); }
        .tier:first-of-type { border-top: 0; padding-top: 0; }
        .tier-side { position: sticky; top: 150px; align-self: start; }
        .tier-sym { font-family: var(--display); font-weight: 800; font-size: 76px; line-height: .9; letter-spacing: -0.04em; color: transparent; -webkit-text-stroke: 1.5px var(--lake); }
        .tier-side h3 { font-family: var(--display); font-size: 24px; margin: 10px 0 2px; letter-spacing: -0.01em; color: var(--lake); }
        .tier-side p { margin: 0; color: var(--slate); font-size: 14.5px; }
        .tier-tip { margin-top: 18px; display: inline-flex; gap: 8px; align-items: center; padding: 8px 14px; border-radius: 999px; background: var(--geranium-soft); color: #A32336; font-size: 14px; font-weight: 600; }
        @media (max-width: 860px) { .tier { grid-template-columns: 1fr; gap: 18px; } .tier-side { position: static; } .tier-sym { font-size: 56px; } }

        .menu { list-style: none; margin: 0; padding: 0; }
        .menu.cols { columns: 2; column-gap: 48px; }
        .menu.cols li { break-inside: avoid; }
        @media (max-width: 860px) { .menu.cols { columns: 1; } }
        .menu-item { padding: 16px 12px; margin: 0 -12px; border-radius: var(--r-sm); transition: background .2s; }
        .menu-item:hover { background: var(--paper); }
        .menu-row { display: flex; align-items: baseline; gap: 10px; }
        .menu-row h4 { margin: 0; font-family: var(--display); font-weight: 650; font-size: 21px; letter-spacing: -0.01em; line-height: 1.2; }
        .menu-row .dots { flex: 1; border-bottom: 2px dotted var(--stone); transform: translateY(-5px); min-width: 24px; }
        .menu-row .price { font-family: var(--display); font-weight: 700; color: var(--lake-2); font-size: 17px; white-space: nowrap; }
        .menu-item p { margin: 6px 0 0; color: var(--slate); font-size: 15px; max-width: 62ch; }
        .feature-card { margin-top: 26px; border-radius: var(--r-lg); background: var(--lake); color: #fff; padding: 30px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 28px; }

                            <h3>{pick(tier.title, lang)}</h3>
                            <p>{pick(tier.range, lang)}</p>
                            {tier.tip && <div className="tier-tip"><span aria-hidden="true">💡</span>{pick(tier.tip.label, lang)}: {tier.tip.text}</div>}
                        </div>
                        <ul className="menu">{tier.items.map((it, i) => <MenuItem key={i} item={it} lang={lang} />)}</ul>
                    </section>
                )) : null;
            } else {
                const regular = category.items.filter(i => !i.feature && matches(i));
                const featured = category.items.filter(i => i.feature && matches(i));
                body = (regular.length || featured.length) ? (
                    <>
                        {category.intro && <p className="cat-intro">{pick(category.intro, lang)}</p>}
                        <ul className="menu cols">{regular.map((it, i) => <MenuItem key={i} item={it} lang={lang} />)}</ul>
                        {featured.map((it, i) => (
                            <div className="feature-card" key={i} id={"food-" + slug(pick(it.name, "en"))}>
                                <div>
                                    <h4>{pick(it.name, lang)}<span className="pricepill">{it.price}</span></h4>
                                    <p>{pick(it.desc, lang)}</p>
                                </div>
                                <div className="hours">
                                    <small>{pick(it.hoursLabel, lang)}</small>
                                    <strong>{pick(it.hours, lang)}</strong>
                                    {it.note && <p>{pick(it.note, lang)}</p>}
                                </div>
                            </div>
                        ))}
                    </>
                ) : null;
            }

            return (
                <div className="wrap panel">
                    <div className="panel-head">
                        <h1 className="panel-title">{u.foodTitle}</h1>
                        <div>
                            <p className="panel-lede" style={{ marginBottom: 22 }}>{u.foodLede}</p>
                            <div className="legend">{FOOD.legend.map(l => <div key={l.sym}><b>{l.sym}</b>{pick(l, lang)}</div>)}</div>
                            <p className="legend-note">{pick(FOOD.legendNote, lang)}</p>
                        </div>
                    </div>

                    <div className="toolbar">
                        <div className="chips scroll" role="group" aria-label={u.foodTitle}>
                            {FOOD.categories.map(c => (
                                <button key={c.id} className="chip" aria-pressed={c.id === category.id} onClick={() => setCat(c.id)}>
                                    {pick(c.short || c.label, lang)}<span className="count">{count(c)}</span>
                                </button>
                            ))}
                        </div>
                        <div className="price-filter" role="group" aria-label={u.priceFilter}>
                            <span className="label">{u.priceFilter}</span>
                            <button className="chip" aria-pressed={tiers.length === 0} onClick={() => setTiers([])} style={{ fontFamily: "var(--body)" }}>{u.allPrices}</button>
                            {[1, 2, 3, 4].map(n => <button key={n} className="chip" aria-pressed={tiers.includes(n)} onClick={() => toggleTier(n)}>{"€".repeat(n)}</button>)}
                        </div>
                    </div>

                    {!category.tiers && <SectionTitle>{pick(category.label, lang)}</SectionTitle>}
                    {body || (
                        <div className="empty"><p>{u.noneInRange}</p><button className="btn ghost" onClick={() => setTiers([])}>{u.clearPrice}</button></div>
                    )}
                </div>
            );
        }

        /* ---------- Accommodation ---------- */
        const MAX_KM = 6.5;
        function Residence({ r, lang, u }) {
            const H = HOUSING;
            const grp = H.groups.find(g => g.id === r.group);
            const [first, ...rest] = r.price;
            return (
                <article className="res" id={"res-" + r.id}>
                    <div className="res-top">
                        <div>
                            <h4>{r.name}</h4>
                            {r.address && <p className="addr">📍 {r.address}</p>}
                        </div>
                        <span className={"grp-tag " + r.group}>{pick(grp.short, lang)}</span>
                    </div>

                    <div className="res-price">
                        <div className="from"><small>{u.from} </small>{fmtEuro(r.priceFrom, lang)}<small> {u.perMonth}</small></div>
                        <ul>{r.price.map((p, i) => <li key={i}>{pick(p, lang)}</li>)}</ul>
                        {r.priceNote && <div className="fine">{pick(r.priceNote, lang)}</div>}
                    </div>

                    <dl className="stats">
                        <div className="stat"><dt>{u.space}</dt><dd>{pick(r.space, lang)}</dd></div>
                        <div className="stat"><dt>{u.age}</dt><dd>{pick(r.age, lang)}</dd></div>
                        <div className="stat wide">
                            <dt>{u.distance}</dt><dd>{pick(r.distance, lang)}</dd>
                            <div className="track" aria-hidden="true">
                                <span className="fill" style={{ width: `${(r.distanceKm / MAX_KM) * 100}%` }} />
                                <span className="uni" title={u.uni} />
                                <span className="pin" style={{ left: `calc(${(r.distanceKm / MAX_KM) * 100}% + ${r.distanceKm === 0 ? 7 : 0}px)` }} />
                            </div>
                        </div>
                    </dl>

                    <div className={r.warning ? "elig-warn" : "elig"} style={{ fontSize: 14 }}>
                        <strong>{u.eligibility}</strong>
                        {r.eligibility.length > 1
                            ? <ul>{r.eligibility.map((e, i) => <li key={i}>{pick(e, lang)}</li>)}</ul>
                            : <div style={{ color: r.warning ? undefined : "var(--slate)" }}>{pick(r.eligibility[0], lang)}</div>}
                    </div>

                    <ul className="amen">
                        {Object.keys(H.amenityLabels).map(k => {
                            const [s, note] = r.amen[k] || ["q"];
                            return (
                                <li key={k} className={s === "n" ? "off" : ""}>
                                    <StateIcon s={s} label={u.states[s]} />
                                    <span>{pick(H.amenityLabels[k], lang)}
                                        {(note || s === "s" || s.startsWith("q")) && <span className="n">{note ? pick(note, lang) : u.states[s]}</span>}
                                    </span>
                                </li>
                            );
                        })}
                    </ul>

                    <div className="res-links">
                        {r.links.map((l, i) => <a key={i} className={"btn" + (i ? " ghost" : "")} href={l.url} target="_blank" rel="noreferrer">{pick(l.label, lang)} <Ext /></a>)}
                    </div>
                </article>
            );
        }

        function Housing({ lang, u, t, jumpTo }) {
            const H = HOUSING;
            const [group, setGroup] = useState("all");
            const [sort, setSort] = useState("doc");
            const [view, setView] = useState("cards");

            const list = useMemo(() => {
                let l = H.residences.filter(r => group === "all" || r.group === group);
                if (sort === "price") l = [...l].sort((a, b) => a.priceFrom - b.priceFrom);
                if (sort === "dist") l = [...l].sort((a, b) => a.distanceKm - b.distanceKm);
                return l;
            }, [group, sort]);

            const grouped = sort === "doc";
            const amenKeys = Object.keys(H.amenityLabels);

            return (
                <div className="wrap panel">
                    <div className="panel-head">
                        <h1 className="panel-title">{u.housingTitle}</h1>
                        <p className="panel-lede">{u.housingLede}</p>
                    </div>

                    <div className="h-toolbar">
                        <div className="chips">
                            <button className="chip" aria-pressed={group === "all"} onClick={() => setGroup("all")}>{u.allGroups}<span className="count">{H.residences.length}</span></button>
                            {H.groups.map(g => (
                                <button key={g.id} className="chip" aria-pressed={group === g.id} onClick={() => setGroup(g.id)}>
                                    {pick(g.short, lang)}<span className="count">{H.residences.filter(r => r.group === g.id).length}</span>
                                </button>
                            ))}
                        </div>
                        <div className="h-controls">
                            <label className="sr-only" htmlFor="sort">{u.sort}</label>
                            <select id="sort" className="select" value={sort} onChange={e => setSort(e.target.value)}>
                                <option value="doc">{u.sort}: {u.sortDoc}</option>
                                <option value="price">{u.sort}: {u.sortPrice}</option>
                                <option value="dist">{u.sort}: {u.sortDist}</option>
                            </select>
                            <div className="seg" role="group">
                                <button aria-pressed={view === "cards"} onClick={() => setView("cards")}>{u.cards}</button>
                                <button aria-pressed={view === "compare"} onClick={() => setView("compare")}>{u.compare}</button>
                            </div>
                        </div>
                    </div>

                    <div className="state-legend">
                        {["y", "n", "s", "p", "q"].map(s => <span key={s}><StateIcon s={s} label={u.states[s]} />{u.states[s]}</span>)}
                    </div>

                    {view === "cards" ? (
                        <div className="block">
                            {grouped ? H.groups.filter(g => group === "all" || g.id === group).map(g => {
                                const items = list.filter(r => r.group === g.id);
                                if (!items.length) return null;
                                return (
                                    <section key={g.id}>
                                        <div className="group-head"><h3>{pick(g.label, lang)}</h3>{g.intro && <p>{pick(g.intro, lang)}</p>}</div>
                                        <div className="res-grid">{items.map(r => <Residence key={r.id} r={r} lang={lang} u={u} />)}</div>
                                    </section>
                                );
                            }) : <div className="res-grid">{list.map(r => <Residence key={r.id} r={r} lang={lang} u={u} />)}</div>}
                        </div>
                    ) : (
                        <div className="block compare-wrap">
                            <table className="compare">
                                <thead>
                                    <tr>
                                        <th scope="col"></th>
                                        <th scope="col">{u.from} {u.perMonth}</th>
                                        <th scope="col">{u.space}</th>
                                        <th scope="col">{u.distance}</th>
                                        <th scope="col">{u.age}</th>
                                        {amenKeys.map(k => <th scope="col" key={k} style={{ textAlign: "center" }}>{pick(H.amenityLabels[k], lang)}</th>)}
                                    </tr>
                                </thead>
                                <tbody>
                                    {list.map(r => (
                                        <tr key={r.id}>
                                            <th scope="row">
                                                <button onClick={() => { setView("cards"); jumpTo("res-" + r.id); }}>{r.name}</button>
                                                <div className="gt">{pick(H.groups.find(g => g.id === r.group).short, lang)}</div>
                                            </th>
                                            <td className="num">{fmtEuro(r.priceFrom, lang)}</td>
                                            <td>{pick(r.space, lang)}</td>
                                            <td>{pick(r.distance, lang)}</td>
                                            <td>{pick(r.age, lang)}</td>
                                            {amenKeys.map(k => {
                                                const [s, note] = r.amen[k] || ["q"];
                                                const label = u.states[s] + (note ? " — " + pick(note, lang) : "");
                                                return <td className="c" key={k}><StateIcon s={s} label={label} /></td>;
                                            })}
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    <section className="block">
                        <SectionTitle>{pick(H.listings.title, lang)}</SectionTitle>
                        <div className="listings">
                            <div className="listing-hero">
                                <h4>{pick(H.listings.facebook.name, lang)}</h4>
                                <p>{pick(H.listings.facebook.desc, lang)}</p>
                            </div>
                            <div className="listing-list">
                                <div className="listing">
                                    <a className="big" href={H.listings.lea.url} target="_blank" rel="noreferrer">{pick(H.listings.lea.name, lang)} <Ext /></a>
                                    <p>{pick(H.listings.lea.desc, lang)}</p>
                                </div>
                                {H.listings.groups.map((g, i) => (
                                    <div className="listing" key={i}>
                                        <h5>{pick(g.label, lang)}</h5>
                                        <div className="linkrow">{g.links.map(l => <a key={l.name} className="btn ghost" href={l.url} target="_blank" rel="noreferrer">{l.name} <Ext /></a>)}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    <section className="block" style={{ marginBottom: 0 }}>
                        <SectionTitle>{pick(H.budget.title, lang)}</SectionTitle>
                        <div className="budget">
                            {H.budget.items.map(b => (
                                <div className={"budget-item" + (b.important ? " wide" : "")} key={b.id}>
                                    <h4>{pick(b.title, lang)}</h4>
                                    <p>{pick(b.text, lang)}{b.link && <> <a href={b.link.url} target="_blank" rel="noreferrer">{b.link.label}</a></>}</p>
                                    {b.important && <div className="important"><strong>{pick(b.importantLabel, lang)}</strong>{pick(b.important, lang)}</div>}
                                </div>
                            ))}
                        </div>
                    </section>
                </div>
            );
        }

        function ComingSoon({ t, u, tab }) {
            const n = t.nav.find(x => x.id === tab);
            return (
                <div className="wrap panel">
                    <div className="soon-panel">
                        <div className="ico" aria-hidden="true">{n?.icon}</div>
                        <h3>{n?.label}</h3>
                        <p>{t.placeholder}</p>
                    </div>
                </div>
            );
        }

        /* =====================================================================
           App
           ===================================================================== */
        const TAB_IDS = data.en.nav.map(n => n.id);
        const readHash = () => { const h = location.hash.replace("#", ""); return TAB_IDS.includes(h) ? h : "orientation"; };

        function App() {
            const [lang, setLang] = useState(() => { try { return localStorage.getItem("ag-lang") || "en"; } catch (e) { return "en"; } });
            const [tab, setTab] = useState(readHash);
            const [foodCat, setFoodCat] = useState(FOOD ? FOOD.categories[0].id : null);
            const [palette, setPalette] = useState(false);
            const [solid, setSolid] = useState(false);
            const pendingJump = useRef(null);
            const [, setTick] = useState(0);
            const navRef = useRef(null);
            const navShellRef = useRef(null);
            const indRef = useRef(null);
            const t = data[lang], u = ui[lang];

            useEffect(() => { document.documentElement.lang = lang; try { localStorage.setItem("ag-lang", lang); } catch (e) {} }, [lang]);
            useEffect(() => {
                const onHash = () => setTab(readHash());
                window.addEventListener("hashchange", onHash);
                return () => window.removeEventListener("hashchange", onHash);
            }, []);
            useEffect(() => {
                const onScroll = () => setSolid(window.scrollY > window.innerHeight * 0.55);
                onScroll(); window.addEventListener("scroll", onScroll, { passive: true });
                return () => window.removeEventListener("scroll", onScroll);
            }, []);
            useEffect(() => {
                const onKey = (e) => {
                    if ((e.key === "k" && (e.metaKey || e.ctrlKey)) || (e.key === "/" && !/input|textarea|select/i.test(document.activeElement.tagName))) {
                        e.preventDefault(); setPalette(p => !p);
                    }
                };
                window.addEventListener("keydown", onKey);
                return () => window.removeEventListener("keydown", onKey);
            }, []);

            // sliding indicator under the active section
            useLayoutEffect(() => {
                const place = () => {
                    const btn = navRef.current?.querySelector('[aria-selected="true"]');
                    if (!btn || !indRef.current) return;
                    indRef.current.style.width = btn.offsetWidth + "px";
                    indRef.current.style.transform = `translateX(${btn.offsetLeft}px)`;
                    btn.scrollIntoView({ block: "nearest", inline: "nearest" });
                };
                place();
                window.addEventListener("resize", place);
                document.fonts?.ready.then(place);
                return () => window.removeEventListener("resize", place);
            }, [tab, lang]);

            // after a tab renders, scroll to a requested item (from search / compare table)
            useEffect(() => {
                const id = pendingJump.current;
                if (!id) return;
                pendingJump.current = null;
                requestAnimationFrame(() => {
                    const el = document.getElementById(id);
                    if (!el) return;
                    const y = el.getBoundingClientRect().top + window.scrollY - 150;
                    window.scrollTo({ top: y, behavior: "smooth" });
                    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
                });
            });

            const goTab = (id, { scroll = true } = {}) => {
                setTab(id);
                history.replaceState(null, "", "#" + id);
                if (scroll && navShellRef.current) {
                    const top = navShellRef.current.offsetTop - 70;
                    if (window.scrollY > top + 10 || window.scrollY < top - 400) window.scrollTo({ top, behavior: "smooth" });
                }
            };
            const jumpTo = (id) => { pendingJump.current = id; setTick(x => x + 1); };
            const onSearchGo = (r) => {
                setPalette(false);
                if (r.cat) setFoodCat(r.cat);
                pendingJump.current = r.id;
                goTab(r.tab, { scroll: false });
            };

            const onNavKey = (e) => {
                const i = TAB_IDS.indexOf(tab);
                let n = null;
                if (e.key === "ArrowRight") n = (i + 1) % TAB_IDS.length;
                if (e.key === "ArrowLeft") n = (i - 1 + TAB_IDS.length) % TAB_IDS.length;
                if (n !== null) { e.preventDefault(); goTab(TAB_IDS[n], { scroll: false }); navRef.current.querySelectorAll("button")[n].focus(); }
            };

            const word = t.heroTitle.split(" ");
            const big = word.pop(), kicker = word.join(" ");

            let content;
            if (tab === "orientation") content = <Orientation t={t} u={u} />;
            else if (tab === "activities") content = <Activities t={t} u={u} />;
            else if (tab === "trips") content = <Trips t={t} u={u} />;
            else if (tab === "food" && FOOD) content = <Food lang={lang} u={u} cat={foodCat} setCat={setFoodCat} />;
            else if (tab === "housing" && HOUSING) content = <Housing lang={lang} u={u} t={t} jumpTo={jumpTo} />;
            else content = <ComingSoon t={t} u={u} tab={tab} />;

            return (
                <>
                    <header className={"topbar" + (solid ? " solid" : "")}>
                        <a className="brand" href="#orientation" onClick={(e) => { e.preventDefault(); window.scrollTo({ top: 0, behavior: "smooth" }); }}><Mark />{t.brand}</a>
                        <div className="top-actions">
                            <button className="search-btn" onClick={() => setPalette(true)} aria-label={u.search}>
                                <SearchIco /><span className="grow">{u.search}</span><span className="kbd">⌘K</span>
                            </button>
                            <div className="lang" role="group" aria-label="Language">
                                <button aria-pressed={lang === "en"} onClick={() => setLang("en")}>EN</button>
                                <button aria-pressed={lang === "fr"} onClick={() => setLang("fr")}>FR</button>
                            </div>
                        </div>
                    </header>

                    <section className="hero">
                        <img className="hero-photo" src="bg.jpg" alt="" />
                        <div className="hero-inner">
                            {kicker && <p className="hero-kicker">{kicker}</p>}
                            <h1 className="hero-word" aria-label={t.heroTitle}>
                                {big.split("").map((c, i) => <span className="ch" aria-hidden="true" key={i} style={{ animationDelay: `${0.25 + i * 0.07}s` }}>{c}</span>)}
                            </h1>
                            <div className="waterline" />
                            <div className="reflection" aria-hidden="true"><span>{big}</span></div>
                            <div className="hero-sub">
                                <p>{t.heroSub}</p>
                            </div>
                        </div>
                    </section>

                    <div className="navshell" ref={navShellRef}>
                        <nav className="nav" role="tablist" aria-label="Sections" ref={navRef} onKeyDown={onNavKey}>
                            <span className="nav-indicator" ref={indRef} aria-hidden="true" />
                            {t.nav.map(n => (
                                <button key={n.id} role="tab" className="nav-btn" aria-selected={tab === n.id} tabIndex={tab === n.id ? 0 : -1}
                                        aria-controls="panel" onClick={() => goTab(n.id, { scroll: false })}>
                                    <span className="ico" aria-hidden="true">{n.icon}</span>{n.label}
                                    {!READY[n.id] && <span className="soon" title={u.comingSoon} />}
                                </button>
                            ))}
                        </nav>
                    </div>

                    <main id="panel" role="tabpanel" key={tab + lang}>{content}</main>

                    <footer>
                        <div className="wrap">
                            <span className="brand"><Mark />{t.brand}</span>
                            <p>{u.footer}</p>
                        </div>
                    </footer>

                    {palette && <Palette lang={lang} onClose={() => setPalette(false)} onGo={onSearchGo} />}
                </>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
